<style>
  :root { --blue:#0078d4; --accent:#007d9c; --text:#202224; --sub:#5f6368; --line:#e0e0e0; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#fff; color:var(--text); }
  body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; line-height:1.6; }
  header { background:var(--blue); box-shadow:0 2px 5px rgba(0,0,0,.2); }
  .bar { max-width:1100px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:12px; }
  .bar img { width:44px; height:44px; border-radius:6px; image-rendering:pixelated; background:#fff; display:block; }
  .bar span { color:#fff; font-size:1.2rem; font-weight:700; letter-spacing:.02em; }
  .hero { max-width:1100px; margin:0 auto; padding:72px 20px 56px; text-align:center; }
  .hero h1 { margin:0 0 12px; font-size:clamp(2rem,6vw,3.2rem); font-weight:700; line-height:1.2; }
  .hero h1 small { display:block; margin-top:8px; font-size:clamp(1.1rem,3vw,1.5rem); font-weight:400; color:var(--sub); }
  .btn { display:inline-block; margin-top:28px; padding:16px 40px; background:var(--accent); color:#fff; font-size:1.15rem; font-weight:700; text-decoration:none; border-radius:4px; transition:background .15s, box-shadow .15s; }
  .btn:hover, .btn:focus-visible { background:#005f78; box-shadow:0 3px 10px rgba(0,0,0,.25); outline:none; }
  .note { margin-top:14px; font-size:.9rem; color:var(--sub); }
  .steps { max-width:1100px; margin:0 auto; padding:0 20px 72px; }
  .steps h2 { text-align:center; font-size:1.6rem; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:24px; }
  .card b { display:inline-block; width:32px; height:32px; line-height:32px; text-align:center; border-radius:50%; background:var(--accent); color:#fff; margin-bottom:10px; }
