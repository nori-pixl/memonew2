<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>memo</title>
    <link rel="icon" href="memo.png" type="image/png">
    <style>
        :root { --bg-color: #ffffff; --text-color: #333333; --sidebar-bg: #f0f2f5; --active-blue: #0078d4; }
        .dark-mode { --bg-color: #1e1e1e; --text-color: #e0e0e0; --sidebar-bg: #2d2d2d; --active-blue: #005a9e; }
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }
        
        .toolbar { background-color: #0078d4; color: white; padding: 8px; display: flex; align-items: center; gap: 8px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .toolbar button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        /* 装飾ボタン */
        .format-group { display: flex; gap: 4px; background: rgba(0,0,0,0.1); padding: 4px; border-radius: 8px; }
        input[type="color"] { width: 30px; height: 30px; border: none; padding: 0; background: none; cursor: pointer; }

        .main-container { display: flex; flex-grow: 1; position: relative; overflow: hidden; }

        /* --- サイドバー：モバイルとPC共通の開閉ロジック --- */
        .sidebar { 
            width: 280px; 
            background-color: var(--sidebar-bg);
            border-right: 1px solid #ccc;
            padding: 15px;
            overflow-y: auto;
            box-sizing: border-box;
            position: absolute; 
            top: 0; bottom: 0; left: 0; 
            z-index: 1000;
            transition: transform 0.3s ease, width 0.3s ease, padding 0.3s ease;
        }
        .sidebar.hidden { transform: translateX(-100%); }

        @media (min-width: 768px) {
            /* PCではサイドバーはレイアウトの一部（横並び）にする */
            .sidebar { position: relative; transform: none; }
            /* 閉じるときは幅を0にして畳む（transformだけだと見た目が変わらない問題を解消） */
            .sidebar.hidden { 
                width: 0; 
                padding-left: 0; 
                padding-right: 0; 
                border-right: none; 
                overflow: hidden; 
                transform: none;
            }
            /* PCでは暗いオーバーレイは不要（レイアウトが横に詰まるだけなので） */
            .overlay { display: none !important; }
        }

        .editor-area { flex-grow: 1; display: flex; flex-direction: column; width: 100%; background-color: var(--bg-color); min-width: 0; }
        
        /* 編集エリアの修正 */
        #memo { 
            flex-grow: 1; padding: 20px; outline: none; overflow-y: auto;
            font-size: 18px; line-height: 1.6; word-wrap: break-word;
            -webkit-user-select: text; user-select: text;
        }
        #memo:empty:before { content: "ここをタップして入力..."; color: gray; }

        /* --- ルーラー（PC向け、設定でON/OFF） --- */
        .ruler-bar {
            display: none;
            height: 16px;
            background: #e9e9e9;
            border-bottom: 2px solid #c8c8c8;
            overflow: hidden;
            flex-shrink: 0;
        }
        .ruler-bar.show { display: flex; }
        @media (max-width: 767px) {
            /* デスクトップ向け機能なのでスマホ幅では常に非表示 */
            .ruler-bar.show { display: none !important; }
        }
        .ruler-tick {
            flex: 0 0 auto;
            border-right: 1px solid #bbb;
            box-sizing: border-box;
            font-size: 10px;
            color: #666;
            padding-left: 3px;
            position: relative;
        }
        .ruler-tick::after {
            content: '';
            position: absolute;
            right: -1px;
            bottom: 0;
            width: 1px;
            height: 6px;
            background: #999;
        }

        .footer { display: flex; justify-content: space-between; padding: 8px 15px; background: var(--sidebar-bg); font-size: 14px; border-top: 1px solid #ccc; }
        .overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; pointer-events: auto; }
        .overlay.show { display: block; }
        .overlay:not(.show) { display: none !important; pointer-events: none; }

        /* --- 設定モーダル --- */
        .settings-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 2000;
            align-items: center; justify-content: center;
        }
        .settings-overlay.show { display: flex; }
        .settings-box {
            background: var(--bg-color);
            color: var(--text-color);
            width: min(90vw, 360px);
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .settings-box h3 { margin-top: 0; }
        .settings-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; font-size: 14px; }
        .settings-row.inline { flex-direction: row; align-items: center; justify-content: space-between; }
        .settings-row select {
            padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;
            background: var(--bg-color); color: var(--text-color);
        }
        .settings-row input[type="checkbox"] { width: 18px; height: 18px; }
        .settings-close-btn {
            width: 100%; padding: 10px; margin-top: 6px;
            background: var(--active-blue); color: white; border: none; border-radius: 6px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <button onclick="toggleSidebar()">☰</button>
    <div class="format-group">
        <!-- onpointerdownでクリックより先に処理を割り込ませ、選択を維持します -->
        <button class="format-btn" 
                onpointerdown="event.preventDefault(); execCmd('bold');" 
                unselectable="on">B</button>
        <button class="format-btn" 
                onpointerdown="event.preventDefault(); execCmd('italic');" 
                style="font-style: italic;" 
                unselectable="on">I</button>
        <input type="color" 
               onchange="execCmd('foreColor', this.value)" 
               onpointerdown="event.preventDefault();">
    </div>
    <!-- ツールバー内に追加 -->
<div style="display:flex; align-items:center; gap:5px; background:rgba(0,0,0,0.1); padding:4px 8px; border-radius:8px;">
    <span style="font-size:12px;">A</span>
    <input type="range" id="global-size-slider" min="12" max="60" value="18" 
           oninput="changeGlobalFontSize(this.value)" 
           style="width: 70px; cursor: pointer;">
    <span style="font-size:18px;">A</span>
</div>

    <div style="flex-grow:1"></div>
    <button onclick="openSettings()" title="設定">⚙️</button>
    <button onclick="exportAllData()">💾</button>
</div>

<div class="main-container">
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <button style="width:100%; padding:10px; margin-bottom:10px;" onclick="addFolder()">＋ 新規フォルダ</button>
        <div id="tree-container"></div>
    </div>
    <div class="editor-area">
        <div class="ruler-bar" id="ruler-bar"></div>
        <!-- contenteditable="true" を確実に設定 -->
        <div id="memo" contenteditable="true"></div>
        <div class="footer">
            <span id="current-display">ファイル未選択</span>
            <span id="char-count">0 文字</span>
        </div>
    </div>
</div>

<!-- 設定モーダル -->
<div class="settings-overlay" id="settings-overlay" onclick="closeSettingsOnBackdrop(event)">
    <div class="settings-box" onclick="event.stopPropagation()">
        <h3>設定</h3>

        <div class="settings-row">
            <label for="setting-font">フォント</label>
            <select id="setting-font" onchange="applySettings()">
                <option value="sans-serif">ゴシック体（標準）</option>
                <option value="'Yu Gothic', 'Hiragino Kaku Gothic ProN', sans-serif">游ゴシック</option>
                <option value="'Yu Mincho', 'Hiragino Mincho ProN', serif">明朝体</option>
                <option value="'UD Digi Kyokasho NK-R', sans-serif">教科書体風</option>
                <option value="monospace">等幅（コード風）</option>
                <option value="cursive">手書き風</option>
            </select>
        </div>

        <div class="settings-row inline">
            <label for="setting-bullet">Enterキーで「・」を自動追加</label>
            <input type="checkbox" id="setting-bullet" onchange="applySettings()">
        </div>

        <div class="settings-row inline">
            <label for="setting-ruler">ルーラーを表示する（PC）（ベータ）</label>
            <input type="checkbox" id="setting-ruler" onchange="applySettings()">
        </div>

        <div class="settings-row">
            <label for="setting-keyboard">キーボードの種類</label>
            <select id="setting-keyboard" onchange="applySettings()">
                <option value="text">通常（文字）</option>
                <option value="numeric">数字</option>
                <option value="tel">電話番号</option>
                <option value="email">メールアドレス</option>
                <option value="url">URL</option>
                <option value="decimal">小数</option>
                <option value="search">検索</option>
                <option value="none">キーボードを表示しない</option>
            </select>
        </div>

        <button class="settings-close-btn" onclick="closeSettings()">閉じる</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('memo_db_v8')) || { "メモ": { "はじめて": "文字を選択してBを押してね" } };
    let currentPath = JSON.parse(localStorage.getItem('last_path_v8')) || { folder: "", file: "" };
    let appSettings = JSON.parse(localStorage.getItem('memo_settings_v1')) || {
        font: "sans-serif",
        bulletOnEnter: false,
        keyboard: "text",
        rulerEnabled: false
    };

    const memo = document.getElementById('memo');
    const charCount = document.getElementById('char-count');

    // 装飾実行（最重要：フォーカスを外さない処理）
    function execCmd(command, value = null) {
    if (!currentPath.file) return;

    // 1. 編集エリアにフォーカスを強制
    memo.focus();

    // 2. コマンド実行
    document.execCommand(command, false, value);

    // 3. 実行後、スマホのキーボードが閉じないように再度フォーカス
    setTimeout(() => {
        memo.focus();
        save();
        updateCharCount();
    }, 10);
}
    
    function changeGlobalFontSize(size) {
    // 編集エリア全体の文字サイズを書き換え
    memo.style.fontSize = size + "px";
    
    // 設定を保存（次回開いたときも同じサイズにするため）
    localStorage.setItem('memo_font_size', size);
}

// ページ読み込み時に保存されたサイズを復元する処理 (window.onload内などに追加)
window.addEventListener('load', () => {
    const savedSize = localStorage.getItem('memo_font_size');
    if (savedSize) {
        memo.style.fontSize = savedSize + "px";
        document.getElementById('global-size-slider').value = savedSize;
    }
});


// 文字数カウントの修正（もっとも確実に動く方法）
function updateCharCount() {
    const text = memo.innerText || "";
    const count = text.replace(/[\n\r]/g, "").length; // 改行を除外
    document.getElementById('char-count').innerText = count + " 文字";
}

    // 保存処理
    function save() {
        if (currentPath.file) {
            db[currentPath.folder][currentPath.file] = memo.innerHTML;
            localStorage.setItem('memo_db_v8', JSON.stringify(db));
        }
    }

    // 入力イベント
    memo.addEventListener('input', () => {
        save();
        updateCharCount();
    });

    // Enterキーで「・」を自動追加する機能
    memo.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && appSettings.bulletOnEnter) {
            e.preventDefault();
            document.execCommand('insertHTML', false, '<br>・ ');
            save();
            updateCharCount();
        }
    });

    // ファイル選択
    function selectFile(folder, file) {
    if (!db[folder] || db[folder][file] === undefined) return;
    
    // 1. データのセット
    currentPath = { folder, file };
    localStorage.setItem('last_path_v8', JSON.stringify(currentPath));
    document.getElementById('current-display').textContent = file;
    memo.innerHTML = db[folder][file] || "";
    updateCharCount();
    
    // 2. サイドバーを強制的に閉じる (スマホ・PC共通)
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('overlay');
    
    sb.classList.add('hidden'); // サイドバーを隠すクラスを追加
    ov.classList.remove('show'); // 黒い背景を消す
    ov.style.display = "none";    // 念のためスタイルでも非表示にする
    
    renderTree();
    
    // 3. 編集エリアに自動でピントを合わせる（すぐに打てるように）
    setTimeout(() => memo.focus(), 100);
}


    /* --- 以下、既存の管理系機能 --- */
    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        const willHide = !sb.classList.contains('hidden'); // これから隠すかどうか

        sb.classList.toggle('hidden');

        if (willHide) {
            ov.classList.remove('show');
            ov.style.display = "none";
        } else {
            ov.classList.add('show');
            ov.style.display = "";
        }
    }
    function renderTree() {
    const container = document.getElementById('tree-container');
    container.innerHTML = "";
    for (const f in db) {
        const folderWrap = document.createElement('div');
        folderWrap.style.marginBottom = "15px";
        
        // フォルダ行（名前 + ＋ボタン + 🗑️ボタン）
        folderWrap.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; margin-bottom:5px;">
                <span>📁 ${f}</span>
                <div style="display:flex; gap:5px;">
                    <button onclick="addFile('${f}')" style="padding:2px 8px;">＋</button>
                    <button onclick="deleteFolder('${f}')" style="background:none; border:none; cursor:pointer;">🗑️</button>
                </div>
            </div>
        `;

        // ファイルリスト
        for (const file in db[f]) {
            const isActive = (currentPath.file === file && currentPath.folder === f);
            const p = document.createElement('div');
            p.style.display = "flex";
            p.style.justifyContent = "space-between";
            p.style.padding = "8px 10px";
            p.style.margin = "2px 0";
            p.style.borderRadius = "5px";
            p.style.cursor = "pointer";
            p.style.backgroundColor = isActive ? "#0078d4" : "rgba(0,0,0,0.05)";
            p.style.color = isActive ? "white" : "inherit";

            p.innerHTML = `
                <span onclick="selectFile('${f}', '${file}')" style="flex-grow:1;">📄 ${file}</span>
                <button onclick="deleteFile('${f}', '${file}')" style="background:none; border:none; color:inherit; cursor:pointer; opacity:0.6;">🗑️</button>
            `;
            folderWrap.appendChild(p);
        }
        container.appendChild(folderWrap);
    }
}
// フォルダ削除
function deleteFolder(folderName) {
    if (confirm(`フォルダ「${folderName}」と中身をすべて削除しますか？`)) {
        delete db[folderName];
        if (currentPath.folder === folderName) resetEditor();
        save();
        renderTree();
    }
}

// ファイル削除
function deleteFile(folder, file) {
    if (confirm(`ファイル「${file}」を削除しますか？`)) {
        delete db[folder][file];
        if (currentPath.folder === folder && currentPath.file === file) resetEditor();
        save();
        renderTree();
    }
}

// エディタのリセット（削除した後に画面を空にする）
function resetEditor() {
    currentPath = { folder: "", file: "" };
    localStorage.removeItem('last_path_v8');
    document.getElementById('current-display').textContent = "ファイル未選択";
    memo.innerHTML = "";
    updateCharCount();
}

    function addFolder() { const n = prompt("フォルダ名"); if(n){ db[n] = {}; renderTree(); save(); } }
    function addFile(f) { const n = prompt("ファイル名"); if(n){ db[f][n] = ""; selectFile(f, n); } }
    function exportAllData() { const blob = new Blob([JSON.stringify(db)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "backup.json"; a.click(); }

    /* --- 設定パネル --- */
    function openSettings() {
        document.getElementById('setting-font').value = appSettings.font;
        document.getElementById('setting-bullet').checked = appSettings.bulletOnEnter;
        document.getElementById('setting-keyboard').value = appSettings.keyboard;
        document.getElementById('setting-ruler').checked = appSettings.rulerEnabled;
        document.getElementById('settings-overlay').classList.add('show');
    }
    function closeSettings() {
        document.getElementById('settings-overlay').classList.remove('show');
    }
    function closeSettingsOnBackdrop(e) {
        if (e.target.id === 'settings-overlay') closeSettings();
    }
    function applySettings() {
        appSettings.font = document.getElementById('setting-font').value;
        appSettings.bulletOnEnter = document.getElementById('setting-bullet').checked;
        appSettings.keyboard = document.getElementById('setting-keyboard').value;
        appSettings.rulerEnabled = document.getElementById('setting-ruler').checked;
        localStorage.setItem('memo_settings_v1', JSON.stringify(appSettings));
        applySettingsToEditor();
    }
    function applySettingsToEditor() {
        memo.style.fontFamily = appSettings.font;
        memo.setAttribute('inputmode', appSettings.keyboard);
        const ruler = document.getElementById('ruler-bar');
        ruler.classList.toggle('show', appSettings.rulerEnabled);
    }

    // ルーラーの目盛りを描画（1目盛り=50px、番号付き）
    function renderRuler() {
        const bar = document.getElementById('ruler-bar');
        bar.innerHTML = '';
        const unitPx = 50;
        const totalUnits = 60;
        for (let i = 0; i <= totalUnits; i++) {
            const tick = document.createElement('div');
            tick.className = 'ruler-tick';
            tick.style.width = unitPx + 'px';
            tick.textContent = i;
            bar.appendChild(tick);
        }
    }

    window.onload = () => {
        renderRuler();
        applySettingsToEditor();
        renderTree();
        if(currentPath.file) selectFile(currentPath.folder, currentPath.file);
    };
</script>
</body>
</html>
